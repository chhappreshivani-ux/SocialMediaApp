<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin-top: 60px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            width: 95%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card" style="max-width: 400px; margin: 60px auto;">

        <h1 style="text-align:center;">📱 SocialApp</h1>

        <h2 style="text-align:center;">Create Account ✨</h2>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button class="primary-btn" type="submit">
                Register
            </button>
        </form>

        <p style="text-align:center;">
            Already have an account?
            <a href="/login/">Login</a>
        </p>

    </div>

</div>

</body>
</html>
