<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
</head>

<body>

<h1>✏️ Edit Profile</h1>

<form method="POST">

    {% csrf_token %}

    <label>Username</label>
    <br>
    <input
        type="text"
        name="username"
        value="{{ request.user.username }}"
        required
    >

    <br><br>

    <label>Email</label>
    <br>
    <input
        type="email"
        name="email"
        value="{{ request.user.email }}"
        required
    >

    <br><br>

    <button type="submit">Save Changes</button>

</form>

<br>

<a href="/profile/">← Back to Profile</a>

</body>
</html>
